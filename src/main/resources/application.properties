spring.application.name=allMessages
server.port=${PORT:8081}

# Configuração do Banco de Dados (Lê a Variável de Ambiente, se não existir usa localhost)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stock_gam_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:03394579}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

